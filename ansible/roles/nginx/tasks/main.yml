---
- name: Install Nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Install SELinux management bindings on Fedora
  ansible.builtin.package:
    name: python3-libsemanage
    state: present
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - ansible_facts['selinux']['status'] == 'enabled'

- name: Allow Nginx to proxy requests to the API on Fedora
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - ansible_facts['selinux']['status'] == 'enabled'

- name: Disable distribution-provided default Nginx sites
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/nginx/sites-enabled/default
    - /etc/nginx/conf.d/default.conf
    - /etc/nginx/conf.d/welcome.conf
  notify: Restart nginx

- name: Configure application Nginx virtual host
  ansible.builtin.template:
    src: mern-basic.conf.j2
    dest: /etc/nginx/conf.d/mern-basic.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started

- name: Apply pending application and Nginx restarts before verification
  ansible.builtin.meta: flush_handlers

- name: Verify the frontend is served through Nginx
  ansible.builtin.uri:
    url: http://127.0.0.1/
    headers:
      Host: "{{ mern_domain }}"
    return_content: true
    status_code: 200
  register: mern_frontend_response
  retries: 10
  delay: 2
  until: "'id=\"root\"' in mern_frontend_response.content"

- name: Verify the API is proxied through Nginx
  ansible.builtin.uri:
    url: http://127.0.0.1/api/v1/health
    headers:
      Host: "{{ mern_domain }}"
    return_content: true
    status_code: 200
  register: mern_api_response
  retries: 10
  delay: 2
  until: >-
    (mern_api_response.json | default({})).get('data', {}).get('status') == 'ok'
