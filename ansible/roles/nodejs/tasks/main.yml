---
- name: Install NodeSource repository prerequisites on Debian-family hosts
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
    update_cache: true
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Create APT keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Install NodeSource signing key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg
    executable: /bin/bash
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Configure NodeSource repository on Debian-family hosts
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ mern_node_major }}.x nodistro main"
    filename: nodesource
    state: present
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Configure NodeSource repository on Fedora
  ansible.builtin.yum_repository:
    name: nodesource-nodejs
    description: "Node.js {{ mern_node_major }}.x Packages for Fedora"
    baseurl: "https://rpm.nodesource.com/pub_{{ mern_node_major }}.x/nodistro/nodejs/$basearch"
    gpgcheck: true
    gpgkey: https://rpm.nodesource.com/gpgkey/ns-operations-public.key
    enabled: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Install Node.js
  ansible.builtin.package:
    name: nodejs
    state: present
